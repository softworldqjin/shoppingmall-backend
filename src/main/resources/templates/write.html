<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link href="/main.css" rel="stylesheet"/>
</head>
<body>
<div th:replace="~{nav.html::navbar}"></div>

<form action="/add" method="POST">
<!--    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">-->
    <input type="hidden" name="username" th:value="${#authentication.name}">
    <input type="hidden" id="imageUrl" name="url">
    <input name="title" placeholder="상품명 입력">
    <input name="price" placeholder="가격 입력">
    <button type="submit">전송</button>
</form>

<input type="file" onchange="getURL(this)">

<script>
    async function getURL(e) {
        let name = encodeURIComponent(e.files[0].name)
        let result = await fetch('/presigned-url?filename=' + name)
        result = await result.text()

        let r = await fetch(result, {
            method : 'PUT',
            body : e.files[0]
        })

        if (r.ok) {
            let imageUrl = result.split('?')[0]
            document.querySelector('#imageUrl').value = imageUrl
        }
        console.log(r.status);
        console.log(r.url)
    }
</script>
</body>
</html>
